name: Release Windows

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public signaling URL baked into the installer
        required: true
        default: https://telinha-server.onrender.com

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ inputs.api_url }}
        with:
          tagName: telinha-v__VERSION__-build-${{ github.run_number }}
          releaseName: Telinha v__VERSION__
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: telinha-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
